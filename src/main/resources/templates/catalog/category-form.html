<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедУчёт — Категории</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
    <header class="header"><a class="brand" th:href="@{/dashboard}"><span class="brand-icon" aria-hidden="true"></span>
            МедУчёт</a>
        <form th:action="@{/logout}" method="post"><button class="button button-secondary" type="submit">Выйти</button>
        </form>
    </header>
    <main class="workspace">
        <nav class="actions" aria-label="Справочники"><a class="text-link" th:href="@{/dashboard}">Главная</a><a
                class="text-link" th:href="@{/catalog/materials}">Материалы</a><a class="text-link"
                th:href="@{/catalog/units}">Единицы измерения</a><a class="text-link"
                th:href="@{/catalog/categories}">Категории</a></nav>
        <h1 th:text="${recordId == null ? 'Добавить категорию' : 'Изменить категорию'}"></h1>
        <form class="editor-form" th:object="${categoryForm}"
            th:action="${recordId == null} ? @{/admin/catalog/categories} : @{/admin/catalog/categories/{id}(id=${recordId})}"
            method="post">
            <div class="message message-error" role="alert" th:if="${#fields.hasErrors('*')}">
                <ul>
                    <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
                </ul>
            </div><input type="hidden" th:field="*{version}">
            <label for="name">Название</label><input id="name" th:field="*{name}" maxlength="100" required>
            <div class="actions"><button class="button" type="submit">Сохранить</button><a class="text-link"
                    th:href="@{/catalog/categories}">Отмена</a></div>
        </form>
    </main>
    <footer class="footer">МедУчёт · Медицинская лаборатория</footer>
</body>

</html>
