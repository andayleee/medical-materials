<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедУчёт — Журнал операций</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
    <header class="header"><a class="brand" th:href="@{/dashboard}"><span class="brand-icon" aria-hidden="true"></span>
            МедУчёт</a>
        <form th:action="@{/logout}" method="post"><button class="button button-secondary" type="submit">Выйти</button>
        </form>
    </header>
    <main class="workspace">
        <nav class="actions" aria-label="Складской учёт"><a class="text-link" th:href="@{/dashboard}">Главная</a><a
                class="text-link" th:href="@{/operations}">Документы</a><a class="text-link"
                th:href="@{/operations/journal}">Журнал</a><a class="text-link" th:href="@{/reports}">Отчёты</a><a
                class="text-link" th:if="${canOperate}" th:href="@{/inventory/stock}">Остатки</a><a class="text-link"
                th:if="${canOperate}" th:href="@{/inventory/suppliers}">Поставщики</a></nav>
        <h1>Журнал операций</h1>
        <p class="muted">Записи появляются при успешном проведении документа.</p>
        <div class="table-scroll">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Время (Москва)</th>
                        <th>Документ</th>
                        <th>Операция</th>
                        <th>Провёл</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e:${events}">
                        <td
                            th:text="${#temporals.format(e.time.atZone(T(java.time.ZoneId).of('Europe/Moscow')), 'dd.MM.yyyy HH:mm:ss')}">
                        </td>
                        <td><a class="text-link" th:href="@{/operations/{id}(id=${e.documentId})}"
                                th:text="${e.number}"></a></td>
                        <td th:text="${operationNames[e.type]}"></td>
                        <td th:text="${e.actor}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(events)}">
                        <td colspan="4">Проведённых операций пока нет.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer class="footer">МедУчёт · Медицинская лаборатория</footer>
</body>

</html>
