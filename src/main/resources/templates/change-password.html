<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедУчёт — смена пароля</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
    <header class="header"><span class="brand"><span class="brand-icon" aria-hidden="true"></span> МедУчёт</span>
        <form th:action="@{/logout}" method="post"><button class="button button-secondary" type="submit">Выйти</button>
        </form>
    </header>
    <main class="workspace">
        <h1>Задайте свой пароль</h1>
        <p class="description">Если вы вошли по временному паролю, замените его, чтобы продолжить работу.</p>
        <form class="editor-form" th:action="@{/change-password}" method="post">
            <p class="message message-error" role="alert" th:if="${error}" th:text="${error}"></p>
            <label for="currentPassword">Текущий / временный пароль</label><input id="currentPassword"
                name="currentPassword" type="password" autocomplete="current-password" required>
            <label for="newPassword">Новый пароль</label><input id="newPassword" name="newPassword" type="password"
                autocomplete="new-password" minlength="10" maxlength="72" required>
            <small class="muted">Не менее 10 символов, не более 72 байт UTF-8. Пароль должен отличаться от
                текущего.</small>
            <label for="confirmation">Повторите новый пароль</label><input id="confirmation" name="confirmation"
                type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
            <button class="button" type="submit">Сохранить пароль</button>
        </form>
    </main>
    <footer class="footer">МедУчёт · Медицинская лаборатория</footer>
</body>

</html>
